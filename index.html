<!DOCTYPE html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf1dc"><title>万仔消消乐</title><link rel="stylesheet" href="style.css"><style>#modalActions{display:grid;gap:8px;margin-top:14px}#modalActions button{border:0;border-radius:12px;padding:12px;width:100%;font-weight:700;background:#e3ead4;color:#466043}#modalActions button.primary{background:#395a3c;color:white}#modalActions button.secondary{background:#e99149;color:white}#modalActions button.ghost{background:transparent;border:1px solid #bdcba9;color:#657b5e}#examForm{text-align:left;margin-top:13px}#examForm fieldset{border:1px solid #d8e1c7;border-radius:11px;margin:9px 0;padding:9px;background:#fffef6}#examForm legend{font-size:12px;font-weight:700;line-height:1.5;padding:0 3px}#examForm label{display:block;font-size:11px;padding:5px 2px;line-height:1.4}#examForm input{accent-color:#395a3c}</style><main class="game"><header><span class="brand"><img src="assets/icons/wanzai.png">万仔俱乐部<small>WANZAI PLAY CLUB</small></span><button id="sound" aria-label="切换音效">♪</button></header><section class="heading"><small>A LITTLE MATCH, A LOT OF JOY</small><h1>万仔<span>消消乐</span>⁕</h1><p>把快乐凑成三个，把烦恼统统消掉。</p></section><div class="levelbar"><b id="level"></b><button id="help">怎么玩 ↗</button></div><div class="progress"><div id="progress"></div></div><section class="playground"><div class="board-label"><span>✦ 今日宜 · 消除烦恼</span><span id="remaining"></span></div><div id="board" aria-label="叠牌棋盘"></div><div class="garden">✿ <span>慢慢来，每一步都算数</span> ✿</div></section><section class="tray-section"><div class="tray-title"><span>你的收集槽</span><span><b id="slots">0</b> / 7</span></div><div id="tray"></div><p id="message" role="status" aria-live="polite"></p></section><div id="reserve"></div><nav class="tools"><button id="undo"><strong>↶</strong>撤回一步<small id="undoCount"></small></button><button id="shuffle"><strong>⤨</strong>重新洗牌<small id="shuffleCount"></small></button><button id="remove"><strong>↥</strong>移出三张<small id="removeCount"></small></button></nav><footer><button id="restart">↻ 重新开始</button><span>小鸟探店 · 快乐营业中</span></footer></main><dialog id="modal"><div id="modalBody"></div><div id="modalActions"></div></dialog><script src="game.js?v=20261109-center"></script></html>
